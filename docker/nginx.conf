server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Stream and cover-art URLs carry auth tokens in their query strings:
    # never leak page URLs to other sites.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build output (assets/index-AbC123.js): safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths (/album/123, /library/songs…) get index.html,
    # which is never cached so new deployments are picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}

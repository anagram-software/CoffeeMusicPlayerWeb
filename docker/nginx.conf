server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Stream and cover-art URLs carry auth tokens in their query strings:
    # never leak page URLs to other sites.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build output (assets/index-AbC123.js): safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Last.fm playlist import: the site's web-player JSON for a public playlist
    # (no CORS headers, so the browser can't call it directly). Only this one
    # endpoint is forwarded, GET only, without cookies either way.
    #   /lastfm/station/<user>/playlists/<id>?page=<n>
    #     → https://www.last.fm/player/station/user/<user>/playlists/<id>?ajax=1&page=<n>
    location ~ ^/lastfm/station/(?<lastfm_user>[A-Za-z0-9_-]+)/playlists/(?<lastfm_playlist>[0-9]+)$ {
        limit_except GET { deny all; }
        if ($arg_page !~ "^[0-9]{1,3}$") { return 400; }

        # A variable in proxy_pass makes nginx resolve www.last.fm per request
        # (so a DNS hiccup can't stop the container from starting). The
        # resolvers come from the container's /etc/resolv.conf; see the Dockerfile.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=300s;
        # Named captures: the regex in the `if` above would overwrite $1/$2.
        proxy_pass https://www.last.fm/player/station/user/$lastfm_user/playlists/$lastfm_playlist?ajax=1&page=$arg_page;
        proxy_ssl_server_name on;
        proxy_set_header Host www.last.fm;
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-store";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Single-page app: unknown paths (/album/123, /library/songs…) get index.html,
    # which is never cached so new deployments are picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
